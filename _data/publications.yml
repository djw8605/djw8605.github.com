# Publications — the canonical record. One entry per work.
#
# Maintained in reverse-chronological order. The page groups by `year` and
# preserves file order within a year, so adding a paper means pasting a block
# at the top.
#
# Author lists, page ranges and DOIs were reconciled against Crossref, so they
# reflect the publisher record rather than the earlier hand-kept list. Where
# Crossref itself only carries initials, initials are kept — do not invent a
# first name.
#
# Fields
#   key         BibTeX citation key AND the page anchor (#key). Must be unique.
#   type        BibTeX entry type: inproceedings | article | phdthesis |
#               mastersthesis | techreport. Drives both the .bib output and the
#               displayed kind label.
#   title       As published.
#   authors     In publication order, "Given Family". `et_al: true` marks a list
#               that is genuinely truncated; `authors_tail` holds authors named
#               after such a truncation so a final-position author is not lost.
#   year        Publication year (not conference year — the five CHEP 2018
#               papers were published in EPJ Web of Conferences 214 in 2019).
#   venue       Short label, displayed.
#   venue_full  Full proceedings/journal name. Used in the .bib.
#   series      pearc | chep | ieee | other. Normalizes the fact that CHEP
#               proceedings appear under three different journal names. Not
#               surfaced as a filter today; kept so one is cheap to add.
#   doi         Bare DOI, no URL prefix.
#   links       Extra links (arXiv, repository record) when there is no DOI or
#               a preprint is worth surfacing.
#   award       Optional. Folds the old "Awards" section into the entry itself.
#   status      Optional. `unresolved` = citation incomplete or provisional.
#               Currently unused; every entry below carries a resolved citation
#               or is a type that legitimately has no DOI.

