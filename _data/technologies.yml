# Technologies referenced by _projects/*.md front matter and the home page.
#
# `name` is the visible badge label. `expansion` is optional and is read only by
# screen readers and search engines, so an acronym badge still resolves to its
# full name without widening the pill. Add an expansion for any entry whose
# label is not self-explanatory outside this field.
#
# Keep this list to substrate that is actually operated or written. A badge that
# every project on earth would also claim carries no information here.

# --- Data federation and caching ---
xrootd:
  name: XRootD
  expansion: XRootD distributed data access framework
osdf:
  name: OSDF
  expansion: Open Science Data Federation
cvmfs:
  name: CVMFS
  expansion: CernVM File System
ceph:
  name: Ceph

# --- Throughput computing and platforms ---
htcondor:
  name: HTCondor
  expansion: HTCondor high-throughput computing scheduler
kubernetes:
  name: Kubernetes
helm:
  name: Helm
docker:
  name: Docker

# --- Authorization and telemetry ---
scitokens:
  name: SciTokens
  expansion: SciTokens capability-based authorization
jsonwebtokens:
  name: JWT
  expansion: JSON Web Tokens
opensearch:
  name: OpenSearch

# --- Languages and runtime ---
go:
  name: Go
python:
  name: Python
linux:
  name: Linux
